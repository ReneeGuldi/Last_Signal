<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Signal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace;}
        #hud { position: absolute; top: 16px; left: 16px; color: #e8c39e; 
                    font-size: 18px; text-shadow: 1px 1px 2px #000;}
        #crosshair { position: 18px; top: 50%; left: 50%; width: 6px; height: 6px;
                    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;}
        #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center; text-align: center;
                background: rgba(0,0,0,0.75); color: #e8c39e; cursor: pointer; }
        #message { position: absolute; top: 30%; width: 100%; text-align: center;
                color: #ffd84a; font-size: 22px; text-shadow: 1px 1px 3px #000;
                pointer-events: none; }
    </style>
</head>
<body> 
    <div id="hud">
        <div id="health">Health: 100</div>
        <div id="ammo">Ammo: 30</div>
        <div id="parts">Radio parts: 0 / 3</div>
    </div>
    <div id="message"></div>
    <div id="crosshair"></div>
    <div id="overlay">
        <h1 id="overlay-title">LAST SIGNAL</h1>
        <p id="overlay-text">Loading...</p>
        <p>Move: WASD, Sprint: Shift, Jump: Space, Look Around: Mouse</p>
    </div>

<!-- Importing the map -->
 <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
 </script>
 <script type="module" src="main.js"></script>
</body>

</html>
