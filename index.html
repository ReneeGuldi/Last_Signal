<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Signal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace;}
        #hud { position: absolute; top: 16px; left: 16px; color: #e8c39e; 
                    font-size: 18px; text-shadow: 1px 1px 2px #000;}
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
                    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;}
        #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center; text-align: center;
                background: rgba(0,0,0,0.75); color: #e8c39e; cursor: pointer; }
        #message { position: absolute; top: 30%; width: 100%; text-align: center;
                color: #ffd84a; font-size: 22px; text-shadow: 1px 1px 3px #000;
                pointer-events: none; }
        #objective { color: #ffd84a; margin-top: 8px; }
        #profile { margin: 18px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 10px;
                cursor: default; }
        #profile input { font: 18px monospace; padding: 6px 10px; width: 220px; text-align: center;
                background: #1d1914; color: #e8c39e; border: 1px solid #7a6040; border-radius: 4px; }
        #profile .pick { display: flex; gap: 10px; }
        #profile button { font: 16px monospace; padding: 6px 16px; cursor: pointer; border-radius: 4px;
                background: #1d1914; color: #e8c39e; border: 1px solid #7a6040; }
        #profile button.selected { background: #e8c39e; color: #1d1914; }
        #you { font-weight: bold; }
        #hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
                background: radial-gradient(circle, transparent 40%, rgba(200, 0, 0, 0.85));
                transition: opacity 0.25s; }
    </style>
</head>
<body> 
    <div id="hud">
        <div id="health">Health: 100</div>
        <div id="ammo">Ammo: 30</div>
        <div id="parts">Radio parts: 0 / 3</div>
        <div id="score">Score: 0</div>
        <div id="objective"></div>
        <div id="you"></div>
        <div id="players"></div>
    </div>
    <div id="hurt"></div>
    <div id="message"></div>
    <div id="crosshair"></div>
    <div id="overlay">
        <h1 id="overlay-title">LAST SIGNAL</h1>
        <p id="overlay-text">Loading...</p>
        <div id="profile">
            <input id="name-input" maxlength="16" placeholder="Your name">
            <div class="pick">
                <button id="pick-female" data-model="female">Female</button>
                <button id="pick-male" data-model="male">Male</button>
            </div>
        </div>
        <p>Move: WASD, Sprint: Shift, Jump: Space, Look Around: Mouse, Shoot: Click, Shove: F</p>
    </div>

<!-- Importing the map -->
 <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
            "socket.io-client": "https://cdn.socket.io/4.8.1/socket.io.esm.min.js"
        }
    }
 </script>
 <script type="module" src="main.js"></script>
</body>

</html>
